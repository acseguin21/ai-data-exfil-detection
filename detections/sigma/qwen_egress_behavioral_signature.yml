title: Documented LLM Egress Beacon Signature (Qwen Investigation)
id: 9e2c4a16-8b3d-4f27-a5e1-0c7d9f6b2a84
status: experimental
description: |
  Zero-baseline, high-fidelity match for the specific behaviour documented in Cohere's
  "Qwen 3.8 Flash Next" investigation: a command-line transfer tool uploading/fetching
  against an Alibaba Cloud OSS bucket, or carrying the published rollout's probe markers,
  or touching the Alibaba metadata endpoint. Unlike the allowlist-relative egress rule,
  this needs NO environment baselining — it keys on the event's own fingerprint. For orgs
  that legitimately use Alibaba OSS, add the upload-intent constraint (see the variant in
  sandbox_unsanctioned_egress.yml) to keep it clean.
references:
  - https://cohere.com/blog/concerning-behaviour-popular-open-weight-ai-model
  - https://huggingface.co/datasets/CohereLabs/10-2026-qwen-investigation-traces
author: Andre Seguin
date: 2026-10-30
tags:
  - attack.exfiltration
  - attack.t1567.002
  - attack.credential-access
  - attack.t1552.005
logsource:
  category: process_creation
  product: linux
detection:
  selection_tool:
    Image|endswith:
      - '/curl'
      - '/wget'
  selection_alibaba_oss:
    CommandLine|contains|all:
      - 'aliyuncs.com'
      - 'oss'
  selection_metadata:
    CommandLine|contains:
      - '100.100.100.200'               # Alibaba Cloud instance metadata
  selection_rollout_markers:
    CommandLine|contains:
      - 'PROBE_PAYLOAD'                  # canary payload from the published rollout
      - '/tmp/put_probe'
  condition: selection_tool and (selection_alibaba_oss or selection_metadata or selection_rollout_markers)
fields:
  - Image
  - CommandLine
  - ParentImage
  - User
falsepositives:
  - Environments that legitimately push to Alibaba OSS from CLI tools. There, drop
    selection_alibaba_oss and rely on the metadata + rollout-marker selections, or add an
    upload-intent constraint. The rollout markers (PROBE_PAYLOAD / put_probe) are exact to
    the published case and effectively never appear benignly.
level: high
